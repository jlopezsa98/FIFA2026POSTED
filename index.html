:root{
  --bg:#f7fbff;
  --card:#ffffff;
  --card2:#f5f9ff;
  --line:#d6e4f3;
  --txt:#142033;
  --mut:#61748c;
  --acc:#125ee8;
  --blue:#125ee8;
  --red:#e82d3f;
  --green:#13a85f;
  --yellow:#ffd447;
  --sky:#21c7f3;
  --navy:#07172f;
  --good:#10a66a;
  --bad:#e44254;
  --warn:#f3b21a;
  --gold:#f7c948;

  --softShadow:0 8px 24px rgba(15,45,95,.10);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  color:var(--txt);
  background:
    radial-gradient(circle at 9% 7%,rgba(232,45,63,.20) 0 10%,transparent 22%),
    radial-gradient(circle at 92% 8%,rgba(18,94,232,.18) 0 12%,transparent 24%),
    radial-gradient(circle at 80% 88%,rgba(19,168,95,.18) 0 11%,transparent 25%),
    linear-gradient(135deg,#fff 0%,#eef7ff 44%,#fefdf8 100%);
  min-height:100vh;
}
body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background-image:
    linear-gradient(30deg,rgba(18,94,232,.045) 12%,transparent 12.5%,transparent 87%,rgba(18,94,232,.045) 87.5%,rgba(18,94,232,.045)),
    linear-gradient(150deg,rgba(232,45,63,.04) 12%,transparent 12.5%,transparent 87%,rgba(232,45,63,.04) 87.5%,rgba(232,45,63,.04));
  background-size:42px 72px;
  opacity:.7;
}
button,input,select,textarea{font:inherit}
button{
  border:1px solid var(--line);
  background:#fff;
  color:var(--txt);
  border-radius:15px;
  padding:10px 14px;
  cursor:pointer;
  font-weight:750;
  box-shadow:0 3px 0 rgba(10,30,70,.06);
  transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease,background .12s ease;
}
button:hover{border-color:var(--blue);box-shadow:var(--softShadow);transform:translateY(-1px)}
button:active{transform:translateY(0);box-shadow:0 2px 0 rgba(10,30,70,.08)}
button.primary{
  color:#fff;
  border:0;
  background:linear-gradient(135deg,var(--red),var(--blue) 55%,var(--green));
  box-shadow:0 10px 24px rgba(18,94,232,.24);
  font-weight:900;
}
button.danger{background:#fff1f3;border-color:#f1a6b0;color:#a31124}
input,select,textarea{
  background:#fff;
  border:1px solid var(--line);
  color:var(--txt);
  border-radius:13px;
  padding:9px 11px;
  min-width:0;
  outline:none;
  transition:border-color .12s ease,box-shadow .12s ease;
}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(18,94,232,.12)}
textarea{width:100%;min-height:80px}
.app{min-height:100vh;display:flex;position:relative;z-index:1}
.side{
  width:280px;
  background:linear-gradient(180deg,#ffffffee,#f7fbffee);
  backdrop-filter:blur(14px);
  border-right:1px solid rgba(214,228,243,.95);
  padding:18px;
  position:sticky;
  top:0;
  height:100vh;
  overflow:auto;
  box-shadow:14px 0 35px rgba(12,38,75,.08);
}
.brand{
  position:relative;
  display:flex;
  gap:12px;
  align-items:center;
  margin-bottom:18px;
  padding:12px;
  border:1px solid var(--line);
  border-radius:24px;
  background:linear-gradient(135deg,#fff,#f3f9ff);
  overflow:hidden;
}
.brand:after{
  content:"Maple  Zayu  Clutch";
  position:absolute;
  right:-18px;
  bottom:5px;
  font-size:10px;
  font-weight:1000;
  letter-spacing:.09em;
  text-transform:uppercase;
  color:rgba(20,32,51,.12);
  transform:rotate(-10deg);
}
.logo{
  width:58px;
  height:58px;
  border-radius:20px;
  background:
    radial-gradient(circle at 30% 25%,#fff 0 12%,transparent 13%),
    conic-gradient(from 215deg,var(--red),var(--yellow),var(--green),var(--sky),var(--blue),var(--red));
  display:grid;
  place-items:center;
  color:#fff;
  text-shadow:0 2px 8px rgba(0,0,0,.35);
  font-weight:1000;
  font-size:25px;
  box-shadow:0 14px 28px rgba(18,94,232,.20);
}
.logo:before{content:"⚽"}
.logo{font-size:0}.logo>*{font-size:25px}
.brand h1{font-size:23px;margin:0;line-height:1.02;color:var(--navy)}
.brand p{margin:5px 0 0;color:var(--mut);font-size:13px;font-weight:650}
.nav{display:grid;gap:8px}
.nav button{
  text-align:left;
  background:rgba(255,255,255,.72);
  border:1px solid transparent;
  padding:12px 13px;
  border-radius:16px;
  color:#20314a;
  box-shadow:none;
}
.nav button:hover{background:#fff;border-color:#bcd1e8;transform:none}
.nav button.active{
  color:#fff;
  background:linear-gradient(135deg,var(--blue),#1742a9);
  border-color:transparent;
  box-shadow:0 10px 22px rgba(18,94,232,.22);
}
.nav button[data-tab="entry"],.nav button[data-tab="summary"]{font-weight:950}
.main{flex:1;padding:24px;min-width:0}
.top{
  display:flex;
  justify-content:space-between;
  gap:14px;
  align-items:flex-start;
  margin-bottom:18px;
  padding:18px 20px;
  border:1px solid var(--line);
  border-radius:28px;
  background:
    linear-gradient(90deg,rgba(255,255,255,.94),rgba(255,255,255,.80)),
    linear-gradient(135deg,var(--red),var(--yellow),var(--green),var(--blue));
  box-shadow:var(--shadow);
}
.top h2{font-size:32px;margin:0;color:var(--navy);letter-spacing:-.03em}.sub{color:var(--mut);margin-top:6px;font-weight:650}
.grid{display:grid;gap:16px}.cols2{grid-template-columns:repeat(2,minmax(0,1fr))}.cols3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{
  background:linear-gradient(180deg,rgba(255,255,255,.97),rgba(247,251,255,.96));
  border:1px solid var(--line);
  border-radius:24px;
  padding:17px;
  box-shadow:var(--shadow);
  position:relative;
  overflow:hidden;
}
.card:before{
  content:"";
  position:absolute;
  inset:0 0 auto 0;
  height:5px;
  background:linear-gradient(90deg,var(--red),var(--yellow),var(--green),var(--sky),var(--blue));
  opacity:.95;
}
.card h3{margin:4px 0 12px;color:var(--navy);letter-spacing:-.015em}.stat{font-size:34px;font-weight:1000;color:var(--blue)}.mut{color:var(--mut)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.spacer{flex:1}
.pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  border:1px solid #c9daf0;
  background:#fff;
  border-radius:999px;
  padding:6px 10px;
  color:#4f6682;
  font-size:12px;
  font-weight:800;
}
.tablewrap{
  overflow:auto;
  border:1px solid var(--line);
  border-radius:20px;
  max-height:70vh;
  background:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8);
}

.rank-gold td{background:rgba(247,201,72,.22)!important}.rank-silver td{background:rgba(220,231,242,.55)!important}.rank-bronze td{background:rgba(214,138,66,.20)!important}.summary-title{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.profile-tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:16px}.minihead{font-size:12px;color:#5f7290;font-weight:1000;text-transform:uppercase;letter-spacing:.055em;margin-bottom:6px}
input[type="range"]{accent-color:var(--blue)}

.pool-filter-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pool-filter-bar select{min-width:190px}
.pool-groups-select{min-width:220px;min-height:92px;width:100%}
.pool-checkbox-list{display:grid;gap:7px;margin-top:4px}
.pool-checkbox{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:14px;padding:8px 10px;cursor:pointer;font-weight:850;color:var(--txt);user-select:none}
.pool-checkbox:hover{border-color:var(--blue);background:rgba(255,255,255,.10)}
.pool-checkbox input{position:absolute;opacity:0;pointer-events:none}
.pool-checkbox .checkmark{width:20px;height:20px;border-radius:7px;border:2px solid var(--line);display:inline-grid;place-items:center;flex:0 0 20px;background:rgba(255,255,255,.08);color:transparent;font-size:14px;font-weight:1000;line-height:1}
.pool-checkbox input:checked + .checkmark{border-color:var(--good);background:var(--good);color:#fff}
.pool-checkbox input:checked + .checkmark:before{content:"✓"}
.pool-checkbox input:checked ~ .pool-checkbox-name{color:var(--good)}
.pool-group-chip{display:inline-flex;align-items:center;border:1px solid var(--line);background:rgba(255,255,255,.08);border-radius:999px;padding:5px 9px;font-size:12px;font-weight:850;color:var(--mut);margin:3px 4px 3px 0}
.pool-manager-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.pool-manager-list{display:grid;gap:8px;margin-top:10px}
.pool-manager-row{display:flex;gap:8px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:15px;padding:9px;background:rgba(255,255,255,.04)}


.results-subnav-card{padding:12px 14px;margin-bottom:16px;overflow:visible}
.results-subnav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.results-subnav button{box-shadow:none;background:rgba(255,255,255,.05);border-color:var(--line);color:var(--mut)}
.results-subnav button:hover{color:var(--txt);background:rgba(255,255,255,.09);transform:none}
.results-subnav button.active{color:#fff;background:linear-gradient(135deg,var(--red),#8f1f2d);border-color:transparent;box-shadow:0 8px 20px rgba(183,58,55,.32)}
.results-subnav-actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

@media(max-width:850px){.app{display:block}.side{position:relative;width:auto;height:auto}.nav{grid-template-columns:repeat(2,1fr)}.main{padding:14px}.cols2,.cols3{grid-template-columns:1fr}.bracket{grid-template-columns:1fr}.top{display:block}.side{border-right:0;border-bottom:1px solid var(--line)}}

body{
  color:var(--txt);
  background:
    radial-gradient(circle at 10% 8%,rgba(45,142,161,.20),transparent 32%),
    radial-gradient(circle at 90% 8%,rgba(183,58,55,.12),transparent 28%),
    radial-gradient(circle at 88% 92%,rgba(36,122,85,.13),transparent 30%),
    linear-gradient(135deg,#04070d 0%,#07101d 47%,#03060b 100%);
}
body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background-image:
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(0deg,rgba(255,255,255,.018) 1px,transparent 1px),
    var(--fifa-pattern);
  background-size:88px 88px,88px 88px,720px auto;
  background-position:center,center,center top;
  background-repeat:repeat,repeat,no-repeat;
  opacity:.16;
  filter:saturate(.45) contrast(.95);
}
button{
  background:linear-gradient(180deg,#111d2e,#0b1525);
  color:var(--txt);
  border-color:#2b3d57;
  box-shadow:0 3px 0 rgba(0,0,0,.25);
}
button:hover{border-color:#496486;background:#13223a;box-shadow:var(--softShadow)}
button.primary{
  color:#08111f;
  border:1px solid rgba(255,255,255,.18);
  background:linear-gradient(135deg,#e2c980,#c7a45d 55%,#9d783f);
  box-shadow:0 12px 28px rgba(199,164,93,.20);
}
button.danger{background:#2a111a;border-color:#633244;color:#ffd9df}
input,select,textarea{
  background:#081321;
  border-color:#263950;
  color:var(--txt);
}
input:focus,select:focus,textarea:focus{border-color:#c7a45d;box-shadow:0 0 0 4px rgba(199,164,93,.13)}
.side{
  background:linear-gradient(180deg,rgba(7,14,25,.94),rgba(5,10,18,.96));
  border-right:1px solid rgba(50,72,102,.78);
  box-shadow:18px 0 42px rgba(0,0,0,.32);
}
.side > *{position:relative;z-index:1}
.side:after{
  content:"";
  position:fixed;
  left:12px;
  bottom:12px;
  width:250px;
  height:170px;
  background-image:linear-gradient(180deg,rgba(5,10,18,.08),rgba(5,10,18,.68)),var(--fifa-mascots);
  background-size:cover;
  background-position:center;
  border-radius:22px;
  opacity:.23;
  filter:saturate(.72) contrast(.95);
  pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);
}
.brand{
  background:linear-gradient(135deg,rgba(12,23,38,.94),rgba(10,18,31,.78));
  border-color:#2b405c;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 16px 36px rgba(0,0,0,.24);
}
.brand:after{
  content:"Canada • Mexico • USA";
  color:rgba(237,244,255,.18);
  right:12px;
  bottom:7px;
}
.logo{
  width:68px;
  height:68px;
  border-radius:18px;
  background-image:linear-gradient(180deg,rgba(5,9,18,.08),rgba(5,9,18,.18)),var(--fifa-logo);
  background-size:cover;
  background-position:center;
  color:transparent;
  text-shadow:none;
  box-shadow:0 12px 26px rgba(0,0,0,.38),inset 0 0 0 1px rgba(255,255,255,.16);
}
.logo:before{content:""}
.brand h1{color:#f4f7ff}
.brand p{color:#9aabc1}
.nav button{background:rgba(10,20,34,.62);border-color:transparent;color:#bdc9d8}
.nav button:hover{background:#101d30;border-color:#344a67;color:#fff}
.nav button.active{
  color:#08111f;
  background:linear-gradient(135deg,#e6c879,#b9934f);
  box-shadow:0 10px 24px rgba(199,164,93,.19);
}
.main{position:relative}
.top{
  position:relative;
  overflow:hidden;
  border-color:#273d5a;
  background:linear-gradient(90deg,rgba(10,19,33,.96),rgba(8,15,27,.90));
  box-shadow:var(--shadow);
}
.top:before{
  content:"";
  position:absolute;
  inset:0;
  background-image:linear-gradient(90deg,rgba(6,11,20,.12),rgba(6,11,20,.86)),var(--fifa-pattern);
  background-size:cover;
  background-position:center;
  opacity:.22;
  filter:saturate(.52) contrast(.92);
}
.top:after{
  content:"";
  position:absolute;
  right:18px;
  top:50%;
  transform:translateY(-50%);
  width:84px;
  height:84px;
  border-radius:22px;
  background-image:var(--fifa-logo);
  background-size:cover;
  background-position:center;
  opacity:.35;
  filter:saturate(.72);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);
  pointer-events:none;
}
.top > *{position:relative;z-index:1}
.top h2{color:#f8fbff}
.sub{color:#9babc0}
.card,.match,.scoring-section,.settingbox{
  background:linear-gradient(180deg,rgba(13,24,40,.98),rgba(9,18,31,.96));
  border-color:#243a56;
  box-shadow:var(--softShadow);
}
.card:before{
  height:2px;
  background:linear-gradient(90deg,rgba(183,58,55,.65),rgba(199,164,93,.55),rgba(45,142,161,.55),rgba(36,122,85,.52));
}
.card h3,.scoring-section h3{color:#f3f7ff}
.stat{color:#d6b66b}
.mut,.scoring-section p,.settingbox .help{color:var(--mut)}
.pill{background:#0a1524;border-color:#2a405b;color:#b8c7d9}
.tablewrap{background:#081321;border-color:#243a56;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
table{color:var(--txt)}
th{background:#101d30;color:#dce7f5;border-bottom-color:#2a3f5b}
td{border-bottom-color:#1f3149}
tr:hover td{background:#101b2c}
.sectionrow td{background:#162843!important;color:#f1f6ff}
.teamline.win,.winner{background:rgba(47,191,122,.18)!important;border-color:rgba(47,191,122,.45)!important;outline-color:rgba(47,191,122,.55)}
.loss{opacity:.70}
.notice{border-color:#2a435f;background:#0d1b2e;color:#bfd0e3}
.error{border-color:#6e2f3f;background:#2b1019;color:#ffdbe2}
.locked{color:#d6b66b}
.current-match{background:linear-gradient(135deg,#101d30,#0b1728);border-color:#273d5a}
.current-match .scorebig{color:#d6b66b}
.qualbox{background:rgba(47,191,122,.10);border-color:rgba(47,191,122,.30)}
.rank-gold td{background:rgba(215,178,90,.22)!important}
.rank-silver td{background:rgba(174,185,200,.22)!important}
.rank-bronze td{background:rgba(168,107,63,.22)!important}
.minihead{color:#91a4bb}
input[type="range"]{accent-color:#d6b66b}
@media(max-width:850px){
  .side:after{display:none}
  .top:after{display:none}
}


/* v18 official-photo palette refinement: dark elegant base, FIFA 2026 graphic colors used consistently */
:root{
  --bg:#050509;
  --card:#0b0d14;
  --card2:#121523;
  --line:#2a2f46;
  --txt:#f7f7ff;
  --mut:#aab0c4;
  --acc:#f2f2f2;
  --blue:#2846ff;
  --red:#e00012;
  --green:#00b85f;
  --yellow:#b6ff00;
  --sky:#61f4df;
  --purple:#6500e8;
  --orange:#ff4a10;
  --maroon:#7c1114;
  --navy:#ffffff;
  --good:#00b85f;
  --bad:#e00012;
  --warn:#ff4a10;
  --gold:#d6b159;
  --silver:#dfe5ef;
  --bronze:#b96f38;
  --shadow:0 22px 58px rgba(0,0,0,.42);
  --softShadow:0 10px 28px rgba(0,0,0,.30);
}
body{
  background:
    radial-gradient(circle at 6% 2%,rgba(97,244,223,.13),transparent 30%),
    radial-gradient(circle at 92% 6%,rgba(224,0,18,.13),transparent 28%),
    radial-gradient(circle at 78% 96%,rgba(101,0,232,.12),transparent 32%),
    linear-gradient(135deg,#040407 0%,#090b13 48%,#030306 100%);
}
body:before{
  opacity:.12;
  filter:saturate(.62) contrast(.96);
}
button{
  background:linear-gradient(180deg,#141824,#090b12);
  border-color:#343a55;
  color:#f7f7ff;
}
button:hover{border-color:rgba(97,244,223,.55);background:#141827}
button.primary{
  color:#ffffff;
  background:linear-gradient(135deg,var(--red),var(--maroon));
  border-color:rgba(255,255,255,.16);
  box-shadow:0 14px 30px rgba(224,0,18,.22);
}
button.danger{background:#2b080d;border-color:#7c1114;color:#ffe6ea}
input,select,textarea{background:#080b13;border-color:#343a55;color:#f7f7ff}
input:focus,select:focus,textarea:focus{border-color:var(--sky);box-shadow:0 0 0 4px rgba(97,244,223,.13)}
.side{
  background:linear-gradient(180deg,rgba(7,8,13,.96),rgba(5,5,9,.98));
  border-right-color:#292f45;
}
.brand{
  background:
    linear-gradient(135deg,rgba(9,11,18,.96),rgba(15,18,29,.82));
  border-color:#2f354d;
}
.logo{box-shadow:0 14px 30px rgba(0,0,0,.42),inset 0 0 0 1px rgba(255,255,255,.18)}
.brand h1,.top h2,.card h3,.scoring-section h3{color:#ffffff}
.brand p,.sub,.mut,.scoring-section p,.settingbox .help{color:#aeb5c9}
.nav button{background:rgba(14,17,27,.66);color:#c4cadb;border-color:transparent}
.nav button:hover{background:#151a29;border-color:rgba(97,244,223,.34);color:#fff}
.nav button.active{
  color:#ffffff;
  background:linear-gradient(135deg,var(--red),var(--maroon));
  box-shadow:0 12px 26px rgba(224,0,18,.20);
}
.top{
  background:linear-gradient(90deg,rgba(10,12,20,.96),rgba(7,8,13,.92));
  border-color:#30374f;
}
.top:before{opacity:.17;filter:saturate(.74) contrast(.92)}
.card,.match,.scoring-section,.settingbox{
  background:linear-gradient(180deg,rgba(16,19,31,.98),rgba(9,11,18,.97));
  border-color:#30374f;
}
.card:before{
  height:2px;
  background:linear-gradient(90deg,var(--purple),var(--red),var(--orange),var(--yellow),var(--sky),var(--blue));
  opacity:.82;
}
.stat,.current-match .scorebig,.locked{color:var(--yellow)}
.pill{background:#0b0e17;border-color:#323a55;color:#d7dcee}
.tablewrap{background:#080b13;border-color:#30374f}
th{background:#131827;color:#eef2ff;border-bottom-color:#343b56}
td{border-bottom-color:#242a3e}
tr:hover td{background:#111624}.sectionrow td{background:#191f31!important;color:#fff}
.teamline.win,.winner{background:rgba(0,184,95,.20)!important;border-color:rgba(0,184,95,.45)!important;outline-color:rgba(0,184,95,.55)}
.notice{background:#0d1220;border-color:#343b56;color:#d5dbee}
.error{background:#2a080d;border-color:#7c1114;color:#ffe2e7}
.current-match{background:linear-gradient(135deg,#111624,#090c14);border-color:#30374f}
.qualbox{background:rgba(0,184,95,.11);border-color:rgba(0,184,95,.32)}
.rank-gold td{background:rgba(182,255,0,.16)!important;color:#f8ffe5}

let APP_RENDERED_OK=false;
let APP_STARTING=true;
let GOOGLE_SHEET_SCRIPT_LOADING_UNTIL=0;
function isVagueCrossOriginScriptError(msg,line,src){
  const m=String(msg||'').toLowerCase().replace(/\.$/,'');
  const l=(line==null || line==='' || Number(line)===0);
  const s=String(src||'');
  return l && (m==='script error' || m.includes('script error') || /docs\.google\.com|googleusercontent|gstatic|githubusercontent/i.test(s) || Date.now()<GOOGLE_SHEET_SCRIPT_LOADING_UNTIL);
}
function showStartupError(title, detail){
  // Never let Safari/GitHub/Google's useless cross-origin line-0 error replace the app.
  if(String(detail||'').toLowerCase().includes('script error') && String(detail||'').includes('Line: 0')) return;
  document.body.innerHTML='<pre style="white-space:pre-wrap;color:white;padding:20px;background:#200;min-height:100vh">'+title+': '+detail+'</pre>';
}
function showNonFatalError(title, detail){
  try{console.error(title, detail)}catch(e){}
  try{
    let box=document.getElementById('nonfatalErrorBox');
    if(!box){
      box=document.createElement('div');
      box.id='nonfatalErrorBox';
      box.style.cssText='position:fixed;left:12px;right:12px;bottom:12px;z-index:999999;background:#fff3f3;color:#7a1010;border:1px solid #f0b4b4;border-radius:14px;padding:10px 12px;font:700 13px system-ui,-apple-system,Segoe UI,Arial;box-shadow:0 8px 30px rgba(0,0,0,.22)';
      document.body.appendChild(box);
    }
    box.textContent=title+': '+String(detail||'Unknown error');
    setTimeout(()=>{try{box.remove()}catch(e){}},6500);
  }catch(e){}
}
window.onerror=function(msg,src,line,col,err){
  if(isVagueCrossOriginScriptError(msg,line,src)) return true;
  const detail=String(msg)+'\nLine: '+line+'\n'+(err&&err.stack?err.stack:'');
  if(APP_RENDERED_OK || !APP_STARTING){showNonFatalError('Runtime error', String(msg)); return true;}
  showStartupError('Runtime error', detail);
  return true;
};
window.addEventListener('error',function(e){
  if(isVagueCrossOriginScriptError(e&&e.message,e&&e.lineno,e&&e.filename)){
    try{e.preventDefault(); e.stopImmediatePropagation();}catch(_e){}
    return false;
  }
},true);
window.onunhandledrejection=function(e){
  const detail=String(e.reason&&e.reason.stack?e.reason.stack:e.reason);
  if(/script error/i.test(detail)) return true;
  if(APP_RENDERED_OK || !APP_STARTING){showNonFatalError('Promise error', detail); return true;}
  showStartupError('Promise error', detail);
  return true;
};

  const allowed=new Set(teamIDs);
  const stats=Object.fromEntries(teamIDs.map(teamID=>[
    teamID,
    {id:teamID,pts:0,gf:0,ga:0,gd:0}
  ]));

  TOURNAMENT.matches
    .filter(match=>
      match.stage==='group' &&
      match.groupID===groupID &&
      allowed.has(match.team1Ref) &&
      allowed.has(match.team2Ref)
    )
    .forEach(match=>{
      const score=scoreObj(match,source);
      if(!isScoreEntered(score))return;

      const score1=+score.s1;
      const score2=+score.s2;
      if(!Number.isFinite(score1)||!Number.isFinite(score2))return;

      const team1=stats[match.team1Ref];
      const team2=stats[match.team2Ref];

      team1.gf+=score1;
      team1.ga+=score2;
      team2.gf+=score2;
      team2.ga+=score1;

      if(score1>score2)team1.pts+=3;
      else if(score2>score1)team2.pts+=3;
      else{
        team1.pts++;
        team2.pts++;
      }
    });

  Object.values(stats).forEach(item=>item.gd=item.gf-item.ga);
  return stats;
}

function sameHeadToHeadRecord(left,right){
  return left.pts===right.pts &&
         left.gd===right.gd &&
         left.gf===right.gf;
}

function splitByComparator(rows,comparator){
  const sorted=[...rows].sort(comparator);
  const groups=[];
  sorted.forEach(row=>{
    const last=groups[groups.length-1];
    if(!last||comparator(last[0],row)!==0||comparator(row,last[0])!==0){
      groups.push([row]);
    }else{
      last.push(row);
    }
  });
  return groups;
}

function resolveOfficialTie(rows,groupID,source,depth=0){
  if(rows.length<=1)return rows;
  if(depth>5){
    const officialOrder=officialFallbackOrderForGroup(groupID);
    return [...rows].sort((a,b)=>
      actualFairPlayValue(a.id)-actualFairPlayValue(b.id) ||
      officialOrder.indexOf(a.id)-officialOrder.indexOf(b.id) ||
      fifaSeedOrder(a.id)-fifaSeedOrder(b.id)
    );
  }

  const head=headToHeadStats(groupID,source,rows.map(row=>row.id));
  const headComparator=(a,b)=>{
    const left=head[a.id];
    const right=head[b.id];
    return right.pts-left.pts ||
           right.gd-left.gd ||
           right.gf-left.gf;
  };

  const headGroups=splitByComparator(rows,headComparator);

  if(headGroups.length>1){
    return headGroups.flatMap(group=>
      group.length>1
        ? resolveOfficialTie(group,groupID,source,depth+1)
        : group
    );
  }

  const overallComparator=(a,b)=>
    b.gd-a.gd ||
    b.gf-a.gf;

  const overallGroups=splitByComparator(rows,overallComparator);

  return overallGroups.flatMap(group=>{
    if(group.length===1)return group;

    const officialOrder=officialFallbackOrderForGroup(groupID);
    return [...group].sort((a,b)=>
      actualFairPlayValue(a.id)-actualFairPlayValue(b.id) ||
      officialOrder.indexOf(a.id)-officialOrder.indexOf(b.id) ||
      fifaSeedOrder(a.id)-fifaSeedOrder(b.id)
    );
  });
}

function officialActualGroupOrder(rows,groupID,source){
  const pointGroups=splitByComparator(rows,(a,b)=>b.pts-a.pts);
  return pointGroups.flatMap(group=>
    group.length>1
      ? resolveOfficialTie(group,groupID,source)
      : group
  );
}

function actualThirdPlaceRankRows(a,b){
  return b.pts-a.pts ||
         b.gd-a.gd ||
         b.gf-a.gf ||
         actualFairPlayValue(a.id)-actualFairPlayValue(b.id) ||
         fifaSeedOrder(a.id)-fifaSeedOrder(b.id);
}

function groupStandings(groupID,source){
  const rows=buildGroupRows(groupID,source);

  if(source==='actual'){
    return {
      groupID,
      rows:officialActualGroupOrder(rows,groupID,source),
      tiebreakerVersion:'fifa-2026'
    };
  }

  rows.sort(legacyRankRows);
  return {
    groupID,
    rows,
    tiebreakerVersion:'legacy-v1'
  };
}

function allGroupStandings(source){
  return TOURNAMENT.groups.map(group=>groupStandings(group.id,source));
}

function thirdPlaceRows(source){
  const standings=allGroupStandings(source);
  const complete=standings.filter(group=>groupIsComplete(group.groupID,source));
  if(complete.length<12)return [];

  const rows=complete.map(group=>group.rows[2]).filter(Boolean);
  rows.sort(source==='actual'?actualThirdPlaceRankRows:legacyRankRows);
  return rows.slice(0,8);
}

function thirdPlaceAssignments(source){
  const thirds=thirdPlaceRows(source);
  if(thirds.length<8)return {};
  const key=thirds.map(row=>row.groupID).sort().join('');
  return THIRD_MAP[key]||{};

  const thirds=thirdPlaceRows(source);
  if(thirds.length<8)return null;
  const group=thirdPlaceAssignments(source)[ref]||null;
  if(!group)return null;
  const row=thirds.find(item=>item.groupID===group);
  return row?teamById[row.id]:null;

/* v23: translate alert/confirm messages in Spanish mode, including dynamic messages */
(function(){
  const nativeAlert = window.alert ? window.alert.bind(window) : null;
  const nativeConfirm = window.confirm ? window.confirm.bind(window) : null;
  function translateRuntimeMessage(msg){
    if(typeof currentLang==='function' && currentLang()!=='es') return msg;
    let out = String(msg);
    const keys = Object.keys(ES_TEXT).sort((a,b)=>b.length-a.length);
    for(const k of keys){
      if(!k || k.length < 3 || !out.includes(k)) continue;
      out = out.split(k).join(ES_TEXT[k]);
    }
    return out;
  }
  if(nativeAlert) window.alert = function(msg){ return nativeAlert(translateRuntimeMessage(msg)); };
  if(nativeConfirm) window.confirm = function(msg){ return nativeConfirm(translateRuntimeMessage(msg)); };
})();

function currentLang(){return state.lang==='es'?'es':'en'}
function trText(v){return currentLang()==='es'?(ES_TEXT[v]||v):v}
function langSelectHTML(extraClass=''){return `<select class="lang-toggle ${extraClass}" data-lang-select title="Language / Idioma"><option value="en" ${currentLang()==='en'?'selected':''}>English</option><option value="es" ${currentLang()==='es'?'selected':''}>Español</option></select>`}
function translateVisibleText(root){
  if(currentLang()!=='es')return;
  root=root||document.body;
  const keys=Object.keys(ES_TEXT).sort((a,b)=>b.length-a.length);
  function translateString(raw){
    if(raw==null)return raw;
    let out=String(raw);
    const trimmed=out.trim();
    if(ES_TEXT[trimmed]) return out.replace(trimmed,ES_TEXT[trimmed]);
    keys.forEach(k=>{
      // Avoid corrupting user-entered names in Spanish.
      // Short labels like P, W, D, L, GF, GA, GD must only translate on exact match,
      // otherwise a name such as Paul becomes PJaul because P translates to PJ.
      if(!k||k.length<3||!out.includes(k))return;
      out=out.split(k).join(ES_TEXT[k]);
    });
    return out;
  }
  const skipTags=new Set(['SCRIPT','STYLE','TEXTAREA']);
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(node){
    const p=node.parentElement; if(!p||skipTags.has(p.tagName))return NodeFilter.FILTER_REJECT;
    const t=node.nodeValue.trim(); if(!t)return NodeFilter.FILTER_REJECT;
    return NodeFilter.FILTER_ACCEPT;
  }});
  const nodes=[]; while(walker.nextNode())nodes.push(walker.currentNode);
  nodes.forEach(n=>{n.nodeValue=translateString(n.nodeValue);});
  root.querySelectorAll('[placeholder],[title],[aria-label],input[type="button"],input[type="submit"]').forEach(el=>{
    ['placeholder','title','aria-label','value'].forEach(attr=>{
      if(el.hasAttribute&&el.hasAttribute(attr)) el.setAttribute(attr,translateString(el.getAttribute(attr)));
    });
  });
}
function currentTab(){
  if(state.tab==='import') state.tab='io';
  if(state.tab==='standings'){state.resultsView='groups';state.tab='results';}
  if(state.tab==='actualtree'){state.resultsView='knockout';state.tab='results';}
  const ok=['dashboard','people','bracket','tree','summary','results','leaderboard','compare','settings','io'];
  if(!ok.includes(state.tab)) state.tab='people';
  if(!isAdminUnlocked() && state.tab==='io')state.tab='settings';
  if(!state.advancedOpen && !['people','bracket','tree','summary','dashboard'].includes(state.tab)) state.tab='people';
  return state.tab;
}

}

function leaderboardPredictionForMatch(match,person){

  if(match.stage!=='group')return predictionForMatch(match,person);

  const hasScores=
    pick.s1!=null&&pick.s2!=null&&
    pick.s1!==''&&pick.s2!==''&&
    Number.isFinite(+pick.s1)&&Number.isFinite(+pick.s2);

  return hasScores?`${pick.s1} - ${pick.s2}`:trText('No prediction');

function predictionForMatch(m,p){
  if(!m||!p)return trText('No prediction');

  const x=(p.picks&&p.picks[m.matchNumber])||{};
  const t1=teamName(m.team1Ref,p.id);
  const t2=teamName(m.team2Ref,p.id);
  const hasScores=
    x.s1!=null&&x.s2!=null&&
    x.s1!==''&&x.s2!==''&&
    Number.isFinite(+x.s1)&&Number.isFinite(+x.s2);
  const w=winnerName(m,p.id);

  if(m.stage==='group'){
    return hasScores ? `${t1} ${x.s1} - ${x.s2} ${t2}` : trText('No prediction');
  }

  const matchup=hasScores
    ? `${t1} ${x.s1} - ${x.s2} ${t2}`
    : '';

  if(w){
    const loser=w===t1?t2:t1;
    const outcome=knockoutOutcomeText(m.stage,w,loser);

  }

function playerColorHash(value){

function ensurePlayerColors(){
  state.playerColors=(state.playerColors&&typeof state.playerColors==='object')?state.playerColors:{};

  Object.keys(state.playerCustomColors).forEach(personId=>{
    const normalized=normalizePlayerHex(state.playerCustomColors[personId]);
    if(!peopleIds.has(personId)||!normalized)delete state.playerCustomColors[personId];
    else state.playerCustomColors[personId]=normalized;
  });
  const validNames=new Set(PLAYER_COLOR_PALETTE.map(c=>c.name));
  const used=new Set();
  (state.people||[]).forEach(person=>{
    const saved=state.playerColors[person.id];
    if(saved&&validNames.has(saved)&&!used.has(saved))used.add(saved);
    else delete state.playerColors[person.id];
  });
  (state.people||[]).forEach(person=>{
    if(state.playerColors[person.id])return;
    const start=playerColorHash(person.id+'|'+person.name)%PLAYER_COLOR_PALETTE.length;
    let chosen=null;
    for(let step=0;step<PLAYER_COLOR_PALETTE.length;step++){
      const candidate=PLAYER_COLOR_PALETTE[(start+step*7)%PLAYER_COLOR_PALETTE.length];
      if(!used.has(candidate.name)){chosen=candidate;break;}
    }
    if(!chosen)chosen=PLAYER_COLOR_PALETTE[start];

    used.add(chosen.name);
  });

function missingBracketItems(pid){
  const p=state.people.find(x=>x.id===pid);
  if(!p)return [];
  const fillKnock=!!(state.options&&state.options.fillKnockoutGoals);
  const missing=[];
  TOURNAMENT.matches.forEach(m=>{
    const o=(p.picks&&p.picks[m.matchNumber])||{};
    if(m.stage==='group' || fillKnock){
      if(!isScoreEntered(o)){
        const t1=teamName(m.team1Ref,pid);
        const t2=teamName(m.team2Ref,pid);
        missing.push({match:m.matchNumber,label:`#${m.matchNumber} ${t1} vs ${t2}`});
      }else if(m.stage!=='group' && +o.s1===+o.s2 && !(o.winner==='team1'||o.winner==='team2')){
        const t1=teamName(m.team1Ref,pid);
        const t2=teamName(m.team2Ref,pid);
        missing.push({match:m.matchNumber,label:`#${m.matchNumber} ${t1} vs ${t2} tiebreak`});
      }
    }else{
      if(!(o.winner==='team1'||o.winner==='team2')){
        const t1=teamName(m.team1Ref,pid);
        const t2=teamName(m.team2Ref,pid);
        missing.push({match:m.matchNumber,label:`#${m.matchNumber} ${t1} vs ${t2}`});
      }
    }
  });
  return missing;
}

function incompleteShareNotice(ids){

function incompleteShareMessage(ids){

function displayDate(dateText){
  const raw=String(dateText||'').trim();
  if(!raw) return '';

  // FIFA's official 2026 schedule lists match times in Eastern Time (ET).
  // These stored dateText values are ET, not UTC. During the tournament
  // ET is EDT (UTC-4), so convert ET -> UTC, then display for the audience:
  // English = Vancouver time, Spanish = Mexico City time.
  const months={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,sept:8,oct:9,nov:10,dec:11};
  const m=raw.match(/^(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Sept|Oct|Nov|Dec)\s+(\d{1,2}),\s*(\d{4})\s+(\d{1,2}):(\d{2})\s*(AM|PM)$/i);
  if(!m){
    return raw.replace(/,\s*2026\b/g,'').replace(/\s+2026\b/g,'').replace(/\s{2,}/g,' ').replace(/\bAM\b/i,'').replace(/\bPM\b/i,'').trim();
  }
  let hour=+m[4];
  const minute=+m[5];
  const ap=m[6].toUpperCase();
  if(ap==='PM' && hour!==12) hour+=12;
  if(ap==='AM' && hour===12) hour=0;

  // Treat raw input as EDT by adding 4 hours to get UTC.
  const d=new Date(Date.UTC(+m[3], months[m[1].toLowerCase()], +m[2], hour + 4, minute));
  const lang=currentLang();
  const timeZone=lang==='es'?'America/Mexico_City':'America/Vancouver';
  const locale=lang==='es'?'es-MX':'en-CA';
  return new Intl.DateTimeFormat(locale,{
    timeZone,
    month:'short',
    day:'numeric',
    hour:'2-digit',
    minute:'2-digit',
    hour12:false
  }).format(d).replace(/\./g,'').replace(',', '').replace(/\s{2,}/g,' ').trim();
}

function pickWinnerValue(raw,team1Name,team2Name,team1ID,team2ID,matchNo,source){
  const w=String(raw||'').trim();
  if(!w)return null;
  const x=normalizeTextKey(w);
  if(['team1','t1','side1','1','home','left'].includes(x))return 'team1';
  if(['team2','t2','side2','2','away','right'].includes(x))return 'team2';

  // First compare against the visible team names/IDs supplied by the CSV row.
  if(x===normalizeTextKey(team1Name)||x===normalizeTextKey(team1ID))return 'team1';
  if(x===normalizeTextKey(team2Name)||x===normalizeTextKey(team2ID))return 'team2';

  // knockout rows may say "Brazil" or "France" while the app internally has refs like 1A, W73, etc.

    const r2=resolveRef(m.team2Ref,source);
    if(r1 && (x===normalizeTextKey(r1.name)||x===normalizeTextKey(r1.id)))return 'team1';
    if(r2 && (x===normalizeTextKey(r2.name)||x===normalizeTextKey(r2.id)))return 'team2';
  }

  const team=teamFromLooseName(w);

function googleSheetInfo(url){
  const raw=String(url||'').trim();
  if(!raw)return null;
  try{
    const u=new URL(raw);
    const m=u.pathname.match(/\/spreadsheets\/d\/([^\/]+)/);
    if(!m)return null;
    return {id:m[1],gid:(u.searchParams.get('gid') || (u.hash.match(/gid=([0-9]+)/)||[])[1] || '0')};
  }catch(e){return null;}
}
function googleSheetCsvUrls(url){
  const raw=String(url||'').trim();
  if(!raw)return [];
  const info=googleSheetInfo(raw);
  let out=[];
  if(info){
    const id=info.id, gid=info.gid;
    out.push(`https://docs.google.com/spreadsheets/d/${id}/export?format=csv&gid=${gid}`);
    out.push(`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&gid=${gid}`);
    out.push(`https://docs.google.com/spreadsheets/d/${id}/pub?output=csv&gid=${gid}`);
  }
  out.push(raw);
  return [...new Set(out)];
}
function csvEscapeCell(v){
  v=(v==null?'':String(v));
  return /[",\n\r]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
}
function googleVizResponseToCsv(resp){
  if(!resp || resp.status!=='ok' || !resp.table)throw new Error((resp&&resp.errors&&resp.errors[0]&&resp.errors[0].detailed_message) || 'Google Sheet did not return readable table data. Make sure sharing is Anyone with the link can view.');
  const cols=(resp.table.cols||[]).map(c=>csvEscapeCell(c.label||c.id||''));
  const lines=[cols.join(',')];
  (resp.table.rows||[]).forEach(r=>{
    const cells=(r.c||[]).map(c=>csvEscapeCell(c ? (c.f!=null?c.f:c.v) : ''));
    while(cells.length<cols.length)cells.push('');
    lines.push(cells.join(','));
  });
  return lines.join('\n');
}
function fetchGoogleSheetViaJsonp(url){
  const info=googleSheetInfo(url);
  if(!info)return Promise.reject(new Error('Not a Google Sheets link'));
  return new Promise((resolve,reject)=>{
    const cb='__fifaSheetCb_'+Date.now()+'_'+Math.floor(Math.random()*100000);
    GOOGLE_SHEET_SCRIPT_LOADING_UNTIL=Date.now()+20000;
    const script=document.createElement('script');
    const cleanup=()=>{try{delete window[cb]}catch(e){window[cb]=undefined;} if(script&&script.parentNode)script.parentNode.removeChild(script); if(Date.now()<GOOGLE_SHEET_SCRIPT_LOADING_UNTIL)GOOGLE_SHEET_SCRIPT_LOADING_UNTIL=0;};
    const timer=setTimeout(()=>{cleanup(); reject(new Error('Google Sheet timed out. Make sure it is shared as Anyone with the link can view.'));},15000);
    window[cb]=(resp)=>{clearTimeout(timer); try{const csv=googleVizResponseToCsv(resp); cleanup(); resolve(csv);}catch(e){cleanup(); reject(e);}};
    script.onerror=()=>{clearTimeout(timer); cleanup(); reject(new Error('Google blocked the live read. Publish the sheet to the web as CSV, or import the CSV file directly.'));};
    const tqx='out:json;responseHandler:'+cb;
    script.src=`https://docs.google.com/spreadsheets/d/${encodeURIComponent(info.id)}/gviz/tq?gid=${encodeURIComponent(info.gid)}&tqx=${encodeURIComponent(tqx)}&tq=${encodeURIComponent('select *')}&_=${Date.now()}`;
    document.head.appendChild(script);
  });
}
async function fetchText(url){
  const urls=googleSheetCsvUrls(url);
  let lastErr=null;
  for(const u of urls){
    try{
      const final=u+(u.includes('?')?'&':'?')+'_='+(Date.now());
      const res=await fetch(final,{cache:'no-store'});
      if(!res.ok)throw new Error(res.status+' '+res.statusText);
      const txt=await res.text();
      const trimmed=txt.trim();
      if(/<html[\s>]/i.test(trimmed) || /<!doctype html/i.test(trimmed)){
        throw new Error('That link opened a web page, not CSV data.');
      }
      return txt;
    }catch(e){lastErr=e;}
  }
  if(googleSheetInfo(url)){
    try{return await fetchGoogleSheetViaJsonp(url);}catch(e){lastErr=e;}
  }
  throw lastErr || new Error('Load failed');
}

// Live score highlighting: update green winner / yellow tie immediately while typing,
// without forcing a full render that would steal focus on iPhone.
function refreshScoreVisual(input){
  try{
    if(!input || !input.dataset || !input.dataset.match || !input.dataset.source) return;
    const matchNumber=+input.dataset.match;
    const source=input.dataset.source;
    const match=TOURNAMENT.matches.find(m=>+m.matchNumber===matchNumber);
    if(!match) return;
    const o=scoreObj(match,source)||{};
    const hasScores=o.s1!=null&&o.s2!=null&&o.s1!==''&&o.s2!==''&&Number.isFinite(+o.s1)&&Number.isFinite(+o.s2);
    const tied=hasScores && +o.s1===+o.s2;
    const w=resultWinner(match,source);

    const row=input.closest('tr');
    if(row && row.querySelector('.group-score-pair')){
      const teamCells=Array.from(row.querySelectorAll('td')).filter(td=>td.querySelector && td.querySelector('.team'));
      const c1=teamCells[0], c2=teamCells[1];
      [c1,c2].forEach(c=>{if(c){c.classList.remove('group-matrix-win','group-matrix-tie','tie','winner');}});
      if(hasScores){
        if(tied){ if(c1)c1.classList.add('group-matrix-tie'); if(c2)c2.classList.add('group-matrix-tie'); }
        else if(w==='team1' && c1) c1.classList.add('group-matrix-win');
        else if(w==='team2' && c2) c2.classList.add('group-matrix-win');
      }
      return;
    }

    const card=input.closest('.match');
    if(card){
      const lines=Array.from(card.querySelectorAll('.teamline')).filter(el=>!el.classList.contains('pick-team'));
      const l1=lines[0], l2=lines[1];
      [l1,l2].forEach(l=>{if(l){l.classList.remove('win','winner','tie');}});
      if(hasScores){
        if(tied){ if(l1)l1.classList.add('tie'); if(l2)l2.classList.add('tie'); }
        else if(w==='team1' && l1) l1.classList.add('win');
        else if(w==='team2' && l2) l2.classList.add('win');
      }
    }
  }catch(e){}
}

// iPhone numeric keyboards often show a down-arrow/done key instead of a real Next key.
// So on phones/tablets the app advances automatically after a score is typed.
let __scoreAutoAdvanceTimer = null;
function isMobileScoreKeyboard(){
  try{return window.matchMedia('(max-width:850px), (pointer:coarse)').matches;}catch(e){return false;}

function scheduleMobileScoreAutoAdvance(input){
  if(!input || !input.matches || !input.matches('input[data-score]')) return;
  if(!isMobileScoreKeyboard()) return;
  const v=String(input.value||'').trim();
  if(!v) return;
  if(__scoreAutoAdvanceTimer) clearTimeout(__scoreAutoAdvanceTimer);
  // One-digit scores move after a short pause. Two-digit scores move right away.
  // This still allows someone to type 10 quickly without the first digit trapping them.
  const delay = v.length >= 2 ? 80 : 520;
  __scoreAutoAdvanceTimer=setTimeout(()=>{
    if(document.activeElement!==input) return;
    if(String(input.value||'').trim()!==v && String(input.value||'').trim().length<2) return;
    focusNextScoreBlank(input);
  },delay);
}
function focusNextScoreBlank(from){
  const inputs = scoreInputList(from);

  if(currentIndex < 0) return false;
  const ordered = inputs.slice(currentIndex + 1).concat(inputs.slice(0, currentIndex));
  const next = ordered.find(el => String(el.value || '').trim() === '') || ordered[0];
  if(!next) return false;
  setTimeout(() => {
    try{
      window.__scoreAutoNavActive=true;
      next.focus({preventScroll:false});
      setTimeout(()=>{window.__scoreAutoNavActive=false;},220);
      if(next.scrollIntoView) next.scrollIntoView({block:'center', inline:'nearest', behavior:'smooth'});
      if(next.select) next.select();
    }catch(e){ try{ next.focus(); }catch(_){} finally {setTimeout(()=>{window.__scoreAutoNavActive=false;},220);} }
  }, 0);
  return true;
}
document.addEventListener('keydown', function(e){
  const t = e.target;
  if(!t || !t.matches || !t.matches('input[data-score]')) return;
  if(e.key === 'Enter'){
    e.preventDefault();
    e.stopPropagation();
    focusNextScoreBlank(t);
  }
}, true);

    state=loadInitialState();
    normalize();
    render();
    setTimeout(()=>{try{if(state.remote&&state.remote.resultsUrl)loadRemoteData(false)}catch(e){}},100);
  }
});
